name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (pinned by constraints.txt)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -c constraints.txt -e .
          pip install pytest pytest-cov

      - name: Run tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'dummy-key-for-ci' }}
          SCREENER_TICKER_COUNT: "5"
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff (whole repo — app.py and cache scripts included)
        run: ruff check .

  streamlit-smoke:
    name: Streamlit import smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -c constraints.txt -e .

      - name: Verify every backend module imports cleanly
        env:
          ANTHROPIC_API_KEY: dummy-key-for-ci
        run: |
          python -c "
          import importlib, pkgutil, stockiq.backend as b
          mods = [m.name for m in pkgutil.walk_packages(b.__path__, 'stockiq.backend.') if not m.name.endswith('__main__')]
          for m in mods:
              importlib.import_module(m)
          print(f'{len(mods)} backend modules imported OK')
          "

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t stockiq:ci .

      - name: Start container and wait for health endpoint
        run: |
          docker run -d --name stockiq -p 8501:8501 stockiq:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo " — healthy"; exit 0; fi
            sleep 2
          done
          docker logs stockiq
          exit 1
