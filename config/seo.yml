# ── JSON-LD FAQ rich snippets ──────────────────────────────────────────────────
# Google can show these as expandable Q&A directly in search results.
faq:
  - q: "What is StockIQ?"
    a: >
      StockIQ is a free, open-source web app that provides institutional-grade
      technical analysis for US stocks and ETFs — including a full-market
      screener, moving averages, RSI, Fibonacci retracement, candlestick patterns,
      short squeeze scanner, Munger quality watchlist, signal backtesting and
      AI-powered SPY forecasts.

  - q: "Is StockIQ free to use?"
    a: >
      Yes, StockIQ is completely free. No account, no login, and no API key
      is required to use the stock analyzer, screener, or any other tool.

  - q: "What is a short squeeze scanner?"
    a: >
      A short squeeze scanner finds stocks with high short interest and rising
      RSI. When the price rises, short sellers are forced to buy shares to cover
      losses, which accelerates the move upward. StockIQ scores each candidate
      by RSI momentum, short float percentage, and days-to-cover.

  - q: "What is the 200-day moving average used for?"
    a: >
      The 200-day moving average smooths roughly ten months of prices and is
      widely watched as a long-term trend line. The Market Screener shows every
      stock's distance from its 200-day average so you can filter on it.

  - q: "What is the 200-week moving average?"
    a: >
      The 200-week moving average represents roughly four years of price history.
      Charlie Munger and other value investors use it as a proxy for intrinsic
      value — buying quality companies when price approaches this long-term average.

  - q: "What is Charlie Munger's stock strategy?"
    a: >
      Charlie Munger advocated buying exceptional businesses at fair prices —
      strong ROE, high profit margins, consistent earnings growth, and low debt.
      StockIQ's Munger Watchlist screens the S&P 500 for these quality factors
      and highlights stocks trading near their 200-week moving average.

  - q: "How is RSI calculated?"
    a: >
      The Relative Strength Index (RSI-14) measures price momentum over 14
      periods using Wilder's smoothing method. Readings above 70 are conventionally
      called overbought and below 30 oversold. These are descriptions of recent
      momentum, not forecasts — use the Signal Backtest page to see how such
      readings have actually played out.

  - q: "What is a Golden Cross and Death Cross?"
    a: >
      A Golden Cross occurs when the 50-day moving average crosses above the
      200-day moving average; a Death Cross is the opposite. They are popular
      trend markers, but in our backtests neither reliably predicted returns —
      the app shows them as information, not as buy or sell signals.

  - q: "What is a Fibonacci retracement?"
    a: >
      Fibonacci retracement levels (23.6%, 38.2%, 50%, 61.8%, 78.6%) mark
      potential support and resistance zones derived from the Fibonacci sequence.
      Traders use them to identify where a retracing stock may find buyers or
      sellers before resuming its trend.

  - q: "What candlestick patterns does StockIQ detect?"
    a: >
      StockIQ automatically detects seven reversal patterns: Hammer (bullish),
      Bullish Engulfing, Morning Star (bullish), Shooting Star (bearish),
      Bearish Engulfing, Evening Star (bearish), and Doji (neutral indecision).

  - q: "What is the SPY AI Outlook?"
    a: >
      The SPY AI Outlook uses your choice of AI provider — Llama 3.3 70B via Groq,
      Gemini 2.0 Flash via Google, or Claude via Anthropic — to generate a
      10-trading-day directional forecast for SPY. It analyses opening gaps, RSI,
      VIX, put/call ratio, and moving averages to produce price targets, intraday
      ranges, and confidence levels — refreshed every hour.
