[theme]
primaryColor = "#22C55E"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
font = "sans serif"

[client]
# "type" shows only the error class to visitors; full tracebacks go to the logs.
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[logger]
level = "info"
