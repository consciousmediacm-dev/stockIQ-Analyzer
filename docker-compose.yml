# docker compose up --build  →  http://localhost:8501
services:
  stockiq:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env            # copy .env.example to .env and fill in keys
    environment:
      STOCKIQ_CACHE_BACKEND: sqlite   # caches survive container restarts
    volumes:
      - stockiq-data:/data            # caches, forecast track record, backtest prices
    restart: unless-stopped

volumes:
  stockiq-data:
